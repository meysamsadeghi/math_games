<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>➕ Garden Add-Venture</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Soft garden-sky canvas sits behind everything -->
  <canvas id="stars-bg"></canvas>
  <!-- Celebration confetti layer -->
  <canvas id="confetti-canvas"></canvas>

  <div id="app">

    <!-- ===================== GARDEN PATH (LEVEL MAP) ===================== -->
    <section id="screen-map" class="screen active">
      <header class="topbar">
        <div class="star-counter"><span class="star-icon">⭐</span><span id="map-stars">0</span></div>
        <button id="btn-book" class="icon-btn" aria-label="collection">📖</button>
      </header>

      <!-- Path stops injected by JS -->
      <div id="path-trail"></div>

      <!-- Hidden long-press reset zone -->
      <div id="reset-zone" title=""></div>
    </section>

    <!-- ===================== MISSION (GAMEPLAY) ===================== -->
    <section id="screen-mission" class="screen">
      <header class="topbar">
        <button id="btn-back" class="icon-btn" aria-label="back">🏠</button>
        <div class="star-counter"><span class="star-icon">⭐</span><span id="mission-stars">0</span></div>
        <button id="btn-mute" class="icon-btn" aria-label="mute">🔊</button>
      </header>

      <!-- Steps-to-complete-level progress dots -->
      <div id="progress-dots" class="progress-dots"></div>

      <!-- Combo flame -->
      <div id="combo-badge" class="combo-badge"></div>

      <!-- Icon-counting question (levels 1-2): two groups of objects to add -->
      <div id="icon-question" class="icon-question">
        <div id="icon-group-a" class="icon-group"></div>
        <div class="icon-plus">+</div>
        <div id="icon-group-b" class="icon-group"></div>
      </div>

      <!-- Digit question (levels 3+): plain equation -->
      <div id="digit-question" class="equation">
        <span id="eq-a" class="eq-num"></span>
        <span class="eq-op">+</span>
        <span id="eq-b" class="eq-num"></span>
        <span class="eq-op">=</span>
        <span class="eq-huh">?</span>
      </div>

      <!-- Four answer boxes (click, or type on keyboard) -->
      <div id="answer-boxes" class="answer-boxes"></div>
    </section>

    <!-- ===================== REWARD ===================== -->
    <section id="screen-reward" class="screen">
      <div class="reward-card">
        <div id="reward-stars" class="reward-stars">
          <span class="rstar" data-i="0">★</span>
          <span class="rstar" data-i="1">★</span>
          <span class="rstar" data-i="2">★</span>
        </div>
        <div id="reward-critter" class="reward-critter"></div>
        <div class="reward-buttons">
          <button id="btn-reward-home" class="icon-btn big" aria-label="home">🏠</button>
          <button id="btn-reward-next" class="icon-btn big" aria-label="next">▶️</button>
        </div>
      </div>
    </section>

    <!-- ===================== BUG BOOK (COLLECTION) ===================== -->
    <section id="screen-book" class="screen">
      <header class="topbar">
        <button id="btn-book-back" class="icon-btn" aria-label="back">🏠</button>
        <div class="star-counter"><span class="star-icon">⭐</span><span id="book-stars">0</span></div>
      </header>
      <div id="critter-grid" class="critter-grid"></div>
    </section>

  </div>

  <script src="game.js"></script>
</body>
</html>
